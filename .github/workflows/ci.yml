name: QA-Swarm CI & SARIF Analysis

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: QA-Swarm Multimodal Audit & SARIF Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with pytest
        run: |
          pytest tests/ -v

      - name: Run QA-Swarm in headless mode via CLI
        run: |
          python -m core.cli --ui test_samples/sample_ui.png --code test_samples/broken_component.py --sarif test_samples/qa_audit.sarif --mock
        continue-on-error: true

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: test_samples/qa_audit.sarif
